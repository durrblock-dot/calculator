<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Activities</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="games-body">
  <header class="games-header">
    <div class="games-nav">
      <button id="showLibrary" class="nav-button">All Activities</button>
      <a href="index.html">Back to Calculator</a>
    </div>
  </header>

  <main class="embed-layout">
    <aside class="sidebar">
      <input id="search" class="search" placeholder="Search">
      <div id="gameList" class="game-list"></div>
    </aside>

    <section class="viewer">
      <div class="viewer-top">
        <strong id="viewerTitle">All Games</strong>
        <a id="openNewTab" target="_blank" rel="noopener" href="https://browlu27.github.io/gamessite.github.io/">Open in new tab</a>
      </div>
      <iframe id="gameFrame" class="game-frame" allowfullscreen allow="fullscreen; gamepad; autoplay; clipboard-read; clipboard-write"></iframe>
    </section>
  </main>

  <script src="games.js"></script>
</body>
</html>
